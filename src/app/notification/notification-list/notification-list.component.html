<div class="notification-container">

  <div class="page-header">
    <div class="header-left">
      <mat-icon class="header-icon">notifications</mat-icon>
      <h1 class="page-title">Notifications</h1>
      <span class="unread-badge" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
    </div>
    <button mat-button color="primary"
            *ngIf="notifications.length > 0 && unreadCount > 0"
            (click)="markAllRead()">
      <mat-icon>done_all</mat-icon>
      Tout marquer comme lu
    </button>
  </div>

  <!-- Liste des notifications -->
  <div class="notifications-list" *ngIf="notifications.length > 0; else emptyState">
    <mat-card
      class="notification-card"
      [class.unread]="!n.read"
      *ngFor="let n of notifications"
      (click)="markRead(n)">
      <mat-card-content class="notif-content">
        <mat-icon class="notif-icon">{{ n.icon }}</mat-icon>
        <div class="notif-body">
          <p class="notif-message">{{ n.message }}</p>
          <span class="notif-date">{{ n.date | date:'dd/MM/yyyy à HH:mm' }}</span>
        </div>
        <span class="unread-dot" *ngIf="!n.read"></span>
      </mat-card-content>
    </mat-card>
  </div>

  <!-- État vide -->
  <ng-template #emptyState>
    <div class="empty-state">
      <mat-icon class="empty-icon">notifications_none</mat-icon>
      <h2 class="empty-title">Aucune notification</h2>
      <p class="empty-subtitle">Vous recevrez ici des alertes sur vos candidatures et les nouvelles opportunités.</p>
    </div>
  </ng-template>

</div>
