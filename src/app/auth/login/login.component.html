<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header class="login-card-header">
      <mat-card-title class="login-title">Connexion</mat-card-title>
      <mat-card-subtitle class="login-subtitle">Accédez à votre espace personnel</mat-card-subtitle>
    </mat-card-header>
    
    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        
        <!-- Email Field -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email *</mat-label>
          <input matInput 
                 formControlName="email" 
                 type="email" 
                 placeholder="Ex: email@example.com"
                 autocomplete="email">
          <mat-icon matSuffix>email</mat-icon>
          <mat-error *ngIf="hasError('email', 'required')">
            {{ getErrorMessage('email') }}
          </mat-error>
          <mat-error *ngIf="hasError('email', 'email')">
            {{ getErrorMessage('email') }}
          </mat-error>
        </mat-form-field>

        <!-- Password Field -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Mot de passe *</mat-label>
          <input matInput 
                 formControlName="password" 
                 type="password" 
                 placeholder="Votre mot de passe"
                 autocomplete="current-password">
          <mat-icon matSuffix>lock</mat-icon>
          <mat-error *ngIf="hasError('password', 'required')">
            {{ getErrorMessage('password') }}
          </mat-error>
          <mat-error *ngIf="hasError('password', 'minlength')">
            {{ getErrorMessage('password') }}
          </mat-error>
        </mat-form-field>

        <!-- Forgot Password Link -->
        <div class="forgot-password-container">
          <button mat-button 
                  type="button" 
                  (click)="onForgotPassword()"
                  class="forgot-password-link">
            <mat-icon>help_outline</mat-icon>
            Mot de passe oublié ?
          </button>
        </div>

        <!-- Error Message -->
        <div *ngIf="errorMessage" class="error-message">
          <mat-icon class="error-icon">error</mat-icon>
          {{ errorMessage }}
        </div>

        <!-- Submit Button -->
        <div class="submit-container">
          <button mat-raised-button 
                  color="primary" 
                  type="submit"
                  class="login-button"
                  [disabled]="isSubmitting || loginForm.invalid">
            <mat-spinner diameter="20" *ngIf="isSubmitting" class="button-spinner"></mat-spinner>
            <mat-icon *ngIf="!isSubmitting" class="button-icon">login</mat-icon>
            {{ isSubmitting ? 'Connexion en cours...' : 'Se connecter' }}
          </button>
        </div>
      </form>
    </mat-card-content>
    
    <mat-card-footer class="login-footer">
      <div class="register-link-container">
        <p>Pas encore de compte ?</p>
        <button mat-button 
                color="primary" 
                routerLink="/register/volonteer"
                class="register-link">
          <mat-icon>person_add</mat-icon>
          Créer un compte
        </button>
      </div>
    </mat-card-footer>
  </mat-card>
</div>
