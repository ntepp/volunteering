
<table mat-table [dataSource]="dataSource" *ngIf="dataSource.length > 0; else emptyState">
    <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef> Titre </th>
        <td mat-cell *matCellDef="let element"> {{element.title}} </td>
    </ng-container>

    <ng-container matColumnDef="location">
        <th mat-header-cell *matHeaderCellDef> Lieu </th>
        <td mat-cell *matCellDef="let element"> {{element.location}} </td>
    </ng-container>

    <ng-container matColumnDef="startDate">
        <th mat-header-cell *matHeaderCellDef> Date de début </th>
        <td mat-cell *matCellDef="let element"> {{element.startDate | date:'dd/MM/yyyy'}} </td>
    </ng-container>

    <ng-container matColumnDef="endDate">
        <th mat-header-cell *matHeaderCellDef> Date de fin </th>
        <td mat-cell *matCellDef="let element"> {{element.endDate | date:'dd/MM/yyyy'}} </td>
    </ng-container>

    <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let element">
            <button mat-icon-button color="primary" (click)="onView(element)" aria-label="Voir les détails">
                <mat-icon>visibility</mat-icon>
            </button>
        </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<ng-template #emptyState>
  <div class="empty-state">
    <mat-icon class="empty-icon">event_busy</mat-icon>
    <h3 class="empty-title">Aucune opportunité publiée</h3>
    <p class="empty-subtitle">Vous n'avez pas encore créé d'opportunité de bénévolat.</p>
  </div>
</ng-template>

<mat-paginator *ngIf="dataSource.length > 0"
             [length]="opportunityPagination.totalItems"
             [pageSize]="opportunityPagination.itemsPerPage"
             [pageSizeOptions]="pageSizeOptions"
             showFirstLastButtons
             (page)="handlePageEvent($event)">
</mat-paginator>
